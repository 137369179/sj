version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: market_recruitment
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/market_recruitment?schema=public
      - JWT_SECRET=your_super_secret_key_for_jwt_session
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data: